spring:
    config:
        import: "classpath:application-secrets.yml"
    application:
        name: Studio Manager v1
    datasource:
        url: 'jdbc:h2:mem:userdb'
        username: sa
        password: ${spring.datasource.password}
    jpa:
        database-platform: org.hibernate.dialect.H2Dialect
    h2:
        console:
            enabled: true
            path: /h2-console


